<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Nav Tabs</title>
<link rel="stylesheet" href="pattern.css">
<style>
  /* a drawn room, so there is something behind the glass */
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, sans-serif; }
  .room { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; min-height: 100%; padding: 24px 16px; box-sizing: border-box; overflow: hidden;
    background: linear-gradient(180deg, #e7dccd 0 72%, #6f4a2c 72% 74%, #9a6c43 74% 100%); }
  .tv { position: absolute; left: 50%; top: 5%; width: min(70%, 900px); height: 58%; transform: translateX(-50%); border-radius: 4px; background: linear-gradient(120deg, #17140f, #2d2823 55%, #120f0c); box-shadow: 0 12px 34px rgba(0, 0, 0, .35); }
  .shelf { position: absolute; left: 0; top: 8%; width: 13%; height: 44%; background: repeating-linear-gradient(180deg, #8c6240 0 6px, #c9a67e 6px 70px); }
  .plant { position: absolute; right: 5%; top: 44%; width: 90px; height: 120px; border-radius: 50% 50% 8px 8px; background: radial-gradient(circle at 50% 30%, #5f7a3a, #33491f 70%); }
  .room > .gn-bar, .row { position: relative; z-index: 1; }
  .row { display: flex; align-items: center; gap: 12px; max-width: 100%; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
  <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></symbol>
  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-3 4.5 4.5 0 0 1 8 3c0 6-8 11-8 11z"/></symbol>
  <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2l2.5 12h11L21 8H6.5"/><circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/></symbol>
</defs></svg>

<main class="room">
  <div class="shelf"></div><div class="tv"></div><div class="plant"></div>

  <nav class="gn-bar gn-smoke" id="a" aria-label="Main">
    <button class="gn-item" aria-current="page"><svg class="gn-ico"><use href="#i-home"/></svg><span class="gn-label">Home</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-compass"/></svg><span class="gn-label">Discover</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-layers"/></svg><span class="gn-label">Library</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-chat"/></svg><span class="gn-label">Messages</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-user"/></svg><span class="gn-label">Profile</span></button>
  </nav>

  <nav class="gn-bar gn-frost" id="b" aria-label="Account">
    <button class="gn-item" aria-current="page"><svg class="gn-ico"><use href="#i-user"/></svg><span class="gn-label">User</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-grid"/></svg><span class="gn-label">Overview</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-folder"/></svg><span class="gn-label">Projects</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-bell"/></svg><span class="gn-label">Alerts</span></button>
    <button class="gn-item"><svg class="gn-ico"><use href="#i-sliders"/></svg><span class="gn-label">Settings</span></button>
  </nav>

  <div class="row">
    <nav class="gn-bar gn-dock" id="c" aria-label="Shop">
      <button class="gn-item" aria-current="page"><svg class="gn-ico"><use href="#i-home"/></svg><span class="gn-label">Home</span></button>
      <button class="gn-item"><svg class="gn-ico"><use href="#i-search"/></svg><span class="gn-label">Search</span></button>
      <button class="gn-item"><svg class="gn-ico"><use href="#i-heart"/></svg><span class="gn-label">Saved</span></button>
      <button class="gn-item"><svg class="gn-ico"><use href="#i-bell"/></svg><span class="gn-label">Alerts</span></button>
    </nav>
    <button class="gn-solo gn-dock" aria-label="Cart, 3 items"><svg class="gn-ico"><use href="#i-cart"/></svg><span class="gn-badge">3</span></button>
  </div>
</main>

<script type="module">
  import { GlassNav } from './pattern.js';
  window.__gn = ['a', 'b', 'c'].map(id => GlassNav(document.getElementById(id)));
</script>
</body>
</html>
