<script>
  // Clone templated scenes (one section per shot) and drive each with a time-indexed step list. Runs before stage.js
  // so the scene:enter listeners exist when the stage fires them; ?t= fast-forwards the steps with transitions off.
  document.querySelectorAll('[data-clone]').forEach(ph => {
    const s = document.createElement('section'); s.className = 'scene'; s.dataset.t = ph.dataset.t; s.dataset.shot = ph.dataset.shot; s.dataset.tl = ph.dataset.tl;
    s.append(document.getElementById(ph.dataset.clone).content.cloneNode(true)); ph.replaceWith(s);
  });
  const q = s => s.querySelector.bind(s), show = el => el.classList.remove('ud-hide'), hide = el => el.classList.add('ud-hide');
  const EXPECTED = 'acme/production-api';
  const timelines = {
    confirm: s => [
      [0.4, () => { show(q(s)('[data-c1]')); show(q(s)('[data-c2]')); }],
      [1.5, () => { show(q(s)('[data-dialog]')); q(s)('[data-dialog]').previousElementSibling.style.opacity = '.35'; hide(q(s)('[data-row]')); show(q(s)('[data-toast]')); q(s)('[data-toast] .ud-toast__ring').classList.add('is-counting'); }],
      [1.8, () => show(q(s)('[data-cap]'))]
    ],
    soft: s => [
      [3, () => { q(s)('[data-row42]').classList.add('is-set'); const d = q(s)('[data-del]'); d.className = 'val'; d.textContent = '"2026-07-03T10:42Z"'; q(s)('[data-fill1]').style.width = '50%'; q(s)('[data-dot2]').classList.add('is-on'); q(s)('[data-lbl2]').classList.add('is-on'); }],
      [6, () => { q(s)('[data-row42]').classList.add('is-purged'); q(s)('[data-fill2]').style.width = '50%'; q(s)('[data-dot3]').classList.add('is-red'); q(s)('[data-lbl3]').classList.add('is-on'); }]
    ],
    type: s => [
      [1.5, () => { q(s)('[data-knob]').style.left = '94%'; q(s)('[data-l2]').classList.remove('is-on'); q(s)('[data-l3]').classList.add('is-on'); }],
      ...EXPECTED.split('').map((_, i) => [2.1 + i * 0.125, () => { q(s)('[data-input]').textContent = EXPECTED.slice(0, i + 1); }]),
      [4.6, () => q(s)('[data-confirm]').classList.add('is-ready')]
    ],
    stack: s => [
      [3, () => { q(s)('[data-line]').classList.add('is-hidden'); q(s)('[data-h="1"]').classList.add('is-undone'); const c = q(s)('[data-count]'); c.textContent = '×1'; c.classList.add('is-on'); }],
      [6, () => { q(s)('[data-ellipse]').classList.add('is-hidden'); q(s)('[data-h="2"]').classList.add('is-undone'); q(s)('[data-count]').textContent = '×2'; }],
      [9, () => { q(s)('[data-rect]').style.transform = 'translate(-64px, -67px)'; q(s)('[data-h="3"]').classList.add('is-undone'); q(s)('[data-count]').textContent = '×3'; }]
    ],
    send: s => {
      const tick = (left, p) => () => { q(s)('[data-time]').textContent = left + 's'; q(s)('[data-fill]').style.setProperty('--p', p + '%'); };
      return [
        [0.3, () => show(q(s)('[data-cur]'))],
        [0.5, () => { q(s)('[data-mail]').classList.add('is-sending'); show(q(s)('[data-sending]')); tick(10, 0)(); }],
        [1.0, tick(10, 5)], [1.5, tick(9, 10)], [2.0, tick(8, 15)], [2.5, () => { tick(8, 22)(); q(s)('[data-word]').className = 'typo'; }], [3.0, tick(7, 30)],
        [3.4, () => { const c = q(s)('[data-cur]'); c.style.left = '585px'; c.style.top = '825px'; }],
        [3.9, () => { q(s)('[data-mail]').classList.remove('is-sending'); hide(q(s)('[data-sending]')); q(s)('[data-word]').className = 'typo'; const c = q(s)('[data-cur]'); c.style.left = '585px'; c.style.top = '840px'; }],
        [5.5, () => { const w = q(s)('[data-word]'); w.className = 'fixed'; w.textContent = 'final'; }]
      ];
    }
  };
  document.querySelectorAll('.scene[data-tl]').forEach(scene => {
    const fresh = scene.innerHTML;
    scene.addEventListener('scene:enter', e => {
      const at = Math.max(0, (e.detail?.t ?? 0) - (Number(scene.dataset.t) || 0));
      (scene._timers || []).forEach(clearTimeout); scene._timers = [];
      scene.innerHTML = fresh; scene.classList.add('no-anim');
      const steps = timelines[scene.dataset.tl](scene);
      steps.forEach(([sec, fn]) => { if (sec <= at) fn(); });
      void scene.offsetWidth;                                                   // flush so the caught-up state does not transition
      requestAnimationFrame(() => scene.classList.remove('no-anim'));
      if (new URLSearchParams(location.search).has('t')) return;            // ?t= is a frozen frame: no future steps
      steps.forEach(([sec, fn]) => { if (sec > at) scene._timers.push(setTimeout(fn, (sec - at) * 1000)); });
    });
  });
</script>
<script type="module">
  // Live behaviour (over http): the hook and outro toasts count down for real and can be undone.
  try {
    const { UndoToast } = await import('./pattern.js');
    ['hookToast', 'outroToast'].forEach(id => { const el = document.getElementById(id); if (el) UndoToast(el, { window: 5000, onUndo: () => el.querySelector('.ud-toast__label').textContent = 'Restored' }); });
  } catch {}
</script>
<script src="../_shared/stage.js"></script>
