<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circle Theme Switch</title>
<link rel="stylesheet" href="pattern.css">
<style>
  :root { --bg: #f4f2ee; --ink: #1c1b19; --card: #fff; --edge: #d9d5ce; }
  :root[data-theme="dark"] { --bg: #111317; --ink: #eceef2; --card: #1a1d23; --edge: #2c313a; color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 14px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--edge); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding: 16px; }
  .tile { background: var(--card); border: 1px solid var(--edge); border-radius: 12px; padding: 14px; }
  .tile b { display: block; font-size: 24px; }
  .cts-toggle { --cts-edge: var(--edge); }
</style>
</head>
<body>
  <header class="bar">
    <strong>Sales</strong>
    <button class="cts-toggle" id="theme" aria-label="Dark theme">
      <svg class="cts-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></svg>
      <svg class="cts-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
    </button>
  </header>
  <main class="tiles">
    <div class="tile"><b>$12,480</b>Revenue this week</div>
    <div class="tile"><b>38</b>Jobs booked</div>
    <div class="tile"><b>4.9</b>Average review</div>
    <div class="tile"><b>2</b>Quotes waiting</div>
  </main>
<script type="module">
  import { CircleThemeSwitch } from './pattern.js';
  CircleThemeSwitch(document.getElementById('theme'));
</script>
</body>
</html>
